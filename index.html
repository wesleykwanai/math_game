<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乘法出擊！小四乘法（二）</title>
<style>
:root{--bg:#101828;--card:#1b2540;--ok:#2ec4b6;--no:#ff6b6b;--ac:#ffd166;--tx:#eef2ff;--mu:#8fa0c0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:"DFKai-SB","標楷體","BiauKai","KaiTi",system-ui,sans-serif;
  display:flex;justify-content:center;align-items:center;padding:12px}
#app{width:min(720px,100%)}
h1{margin:0 0 8px;font-size:clamp(20px,4vw,30px);color:var(--ac);text-align:center}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;font-size:18px;margin-bottom:8px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:4px 14px}
#q{background:var(--card);border-radius:16px;padding:18px;text-align:center;margin:10px 0}
#qtext{font-size:clamp(24px,5.5vw,40px);line-height:1.5}
#hint{color:var(--mu);font-size:17px;margin-top:8px;min-height:24px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#opts button{font:inherit;font-size:clamp(20px,4.5vw,28px);padding:14px 6px;border:0;border-radius:14px;
  background:var(--card);color:var(--tx);cursor:pointer;min-height:64px;touch-action:manipulation}
#opts button:hover{background:#2a385c}
#opts button:disabled{opacity:.55;cursor:default}
.g{border:3px solid var(--ok)!important}.r{border:3px solid var(--no)!important}
#time{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:10px}
#time i{display:block;height:100%;background:var(--ac);width:100%}
#pop{text-align:center;height:28px;font-size:20px;color:var(--ac)}
#over,#start{text-align:center}
.hide{display:none}
#bar{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#bar span{width:18px;height:14px;background:#2a385c;border-radius:3px}
#bar span.y{background:var(--ok)}#bar span.n{background:var(--no)}
button.big{font:inherit;font-size:24px;padding:12px 30px;border:0;border-radius:14px;background:var(--ac);color:#1b2540;cursor:pointer}
small{color:var(--mu)}
#mark{font-size:clamp(60px,16vw,110px);color:var(--ac);line-height:1.1;margin:10px 0}
#wrong{text-align:left;max-height:34vh;overflow:auto;margin:12px 0;padding:0 4px}
#wrong div{background:var(--card);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:17px}
</style>
</head>
<body>
<div id="app">
<h1>乘法出擊！小四乘法（二）4N1</h1>
<div id="start">
  <p>🍬 每次隨機抽 <b>10 題</b>考，答完可以加考多 10 題（同一場最多 20 題，唔會重複）。<br>題目由 9 種題型隨機組合，總共有 <b>137385</b> 條唔同題目。<br>答對會得分，連對有 <b>連擊</b> 加分！</p>
  <p><small>內容依《學習內容補充文件》4N1 乘法（二）：兩位數 × 兩位數、三位數 × 兩位數（含進位）、<br>交換性質、結合性質、估算、解應用題。</small></p>
  <button class="big" onclick="startGame()">開始</button>
</div>
<div id="play" class="hide">
  <div class="bar">
    <span class="pill">第 <b id="num">1</b> / <b id="tot">10</b> 題</span>
    <span class="pill">答對 <b id="ok">0</b></span>
    <span class="pill">連擊 <b id="combo">0</b></span>
  </div>
  <div id="bar"></div>
  <div id="time"><i></i></div>
  <div id="q"><div id="qtext"></div><div id="hint"></div></div>
  <div id="pop"></div>
  <div id="opts"></div>
</div>
<div id="over" class="hide"></div>
</div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick2=()=>R(1,9)*10+R(1,9);           // 隨機兩位數（十位、位都唔會係 0）
const pick3=()=>R(1,9)*100+R(0,9)*10+R(0,9); // 隨機三位數
const uni=a=>[...new Set(a)];
const $=id=>document.getElementById(id);
// 用 DOM 節點砌畫面，唔用 innerHTML 插字串（避免 XSS 風險）
function el(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function bigBtn(txt,fn){const b=el('button','big',txt);b.onclick=fn;return b}
const SEC=15,PER=10,BANK=20;   // PER=每次考幾多題，BANK=題庫總題數（可加考）
// ===== 4N1 乘法（二）題型。每題回傳 {text, ans, hint}；ans 一律為數字字串 =====
// step = 干擾項間距：答案越大，四個選項要拉得越開，否則四位數答案嘅選項會黐埋一齊
const step4=n=>n<100?1:n<1000?10:n<10000?100:1000;
// --- 4N1.1 進行乘法運算：兩位數 × 兩位數、三位數 × 兩位數，當中須包括進位 ---
function qTwo(){const a=pick2(),b=pick2(),p=a*b;
  return{text:`${a} × ${b} = ?`,ans:String(p),step:step4(p),
    hint:`拆兩步做：${a} × ${b%10}，同 ${a} × ${(b-b%10)/10} 個十，加埋`}}
function qCarry(){const b=R(3,9),u=R(Math.ceil(10/b),9),a=R(1,9)*10+u,p=a*b;
  return{text:`${a} × ${b} = ?`,ans:String(p),step:step4(p),
    hint:`個位 ${u} × ${b} = ${u*b}，要寫 ${u*b%10}，兼 ${Math.floor(u*b/10)} 入十位`}}
function qBig(){const a=pick3(),b=pick2(),p=a*b;
  return{text:`${a} × ${b} = ?`,ans:String(p),step:step4(p),
    hint:`拆兩步做：${a} × ${b%10}，同 ${a} × ${(b-b%10)/10} 個十，加埋`}}
// --- 4N1.2 交換性質、結合性質（課程不要求學生用「交換性質」「結合性質」呢兩個詞） ---
function qSwap(){const a=R(11,39),b=R(3,9),p=a*b;
  return{text:`${a} × ${b} = ${p}，寫出 ${b} × ${a} = ?`,ans:String(p),step:step4(p),
    hint:`兩個數對調位置，積唔會變`}}
// 課程闡釋示例：25 × 53 × 4 ＝ 53 × (25 × 4) ＝ 5300
function qCombine(){const r=uni([15,25,35,45])[R(0,3)],m=pick2(),p=m*r*4;
  return{text:`${r} × ${m} × 4 = ?`,ans:String(p),step:step4(p),hint:`先搵 ${r} × 4 = ${r*4}，再乘 ${m}`}}
// --- 4N1.3 注：學生須認識如何估計計算結果 ---
function qEstimate(){const a=pick2(),b=pick2(),ea=Math.round(a/10)*10,eb=Math.round(b/10)*10,p=ea*eb;
  return{text:`估算：${a} × ${b} ≈ ?（兩個數各取最接近嘅十位）`,ans:String(p),approx:true,step:step4(p),
    hint:`${a} 取做 ${ea}，${b} 取做 ${eb}，再相乘`}}
// 結合性質 + 估算：先將兩個數取整十，再乘埋 4（對應課程闡釋的 25 × 53 × 4 例子）
function qEstimate3(){const a=pick2(),b=pick2(),ea=Math.round(a/10)*10,eb=Math.round(b/10)*10,p=ea*eb*4;
  return{text:`估算：${a} × ${b} × 4 ≈ ?（兩個數各取最接近嘅十位）`,ans:String(p),approx:true,step:step4(p),
    hint:`${a} 取做 ${ea}，${b} 取做 ${eb}，再乘 4`}}
function qWord(){const a=pick2(),b=pick2(),p=a*b,k=R(0,3);
  const text=[`${a} 張卡，每張寫咗 ${b} 個字，合共有幾多個字？`,
             `1 盒有 ${a} 支筆，${b} 盒共有幾多支筆？`,
             `${b} 排每排坐 ${a} 人，全部坐滿共坐咗幾多人？`,
             `一件玩具 ${b} 元，買 ${a} 件要幾多元？`][k];
  return{text,ans:String(p),step:step4(p),hint:`列乘法直式：${a} × ${b}`}}
// 逆向思考：乘除關係，搵返因數
function qMissing(){const b=pick2(),a=R(2,9),p=a*b;
  return{text:`${b} × ? = ${p}，問號係幾多？`,ans:String(a),
    hint:`倒轉諗：${p} 可以分成幾多份 ${b}？`}}
// 9 種題型（唔重複填 10 個：makeBank 本身會去重，唔使為咗湊數而重複一個题型）
const TYPES=[qTwo,qCarry,qBig,qSwap,qCombine,qEstimate,qEstimate3,qWord,qMissing];
const key=q=>q.text+q.ans;
// 題庫：n 題（同一次考試內唔會有重複題），每次開始／加考都重新抽
function makeBank(n){
  const b=[],seen=new Set();let guard=n*40;
  while(b.length<n&&guard-->0){const q=TYPES[b.length%TYPES.length]();const k=key(q);
    if(!seen.has(k)){seen.add(k);b.push(q)}}
  for(;b.length<n;){const q=TYPES[b.length%TYPES.length]();seen.add(key(q));b.push(q)} // 抽極耐都撞要加質就補質
  return b.sort(()=>Math.random()-.5);
}
// 4 個不重複選項：3 個干擾（答案 ±step、±2step、±3step）+ 答案
// step 隨答案位數放大，四位數答案嘅選項先拉得開，唔會黐埋一齊
function opts(q){
  const ans=q.ans,n=+ans,st=q.step||1,pool=[];
  for(const v of [n+st,n+2*st,n-st,n-2*st,n+3*st,n-3*st])if(v>=0)pool.push(String(v));
  return uni(pool.filter(v=>v!==ans)).slice(0,3).concat(ans).sort(()=>Math.random()-.5);
}
let S;
function startGame(){S={q:makeBank(PER),i:0,c:0,ok:0,s:0,wrong:[],extra:0,done:PER};
  $('start').classList.add('hide');
  $('play').classList.remove('hide');
  drawDots();next()}
function drawDots(){const bar=$('bar');bar.textContent='';
  for(let i=0;i<S.done;i++)bar.appendChild(el('span'));
  $('tot').textContent=S.done}
function next(){
  const q=S.q[S.i],bar=document.querySelector('#time i');
  const box=$('opts');box.textContent='';
  $('qtext').textContent=q.text;
  $('hint').textContent=q.hint||'';$('pop').textContent='';
  opts(q).forEach(a=>{const b=document.createElement('button');b.textContent=a;
    b.onclick=()=>answer(a,b,q);box.appendChild(b)});
  $('num').textContent=S.i+1;
  $('ok').textContent=S.ok;
  $('combo').textContent=S.c;
  S.t=SEC;bar.style.width='100%';
  clearInterval(S.id);S.id=setInterval(()=>{bar.style.width=(S.t/SEC*100)+'%';
    if(--S.t<=0){clearInterval(S.id);answer(null,null,q)}},1000);
}
function answer(pick,btn,q){
  clearInterval(S.id);
  $('opts').children.forEach(b=>b.disabled=true);
  const pop=$('pop'),ok=pick===q.ans;
  const dot=document.querySelectorAll('#bar span')[S.i];
  if(ok){S.ok++;S.s+=(++S.c)*(1+Math.floor(S.c/3));dot.className='y';
    pop.textContent='✅ +'+(S.c>3?S.c+'連擊!':S.c)}
  else{S.c=0;dot.className='n';S.wrong.push(q);
    pop.textContent=(pick===null?'⏰ 超時！':'❌')+' 正確係：'+q.ans}
  if(btn)btn.classList.add(ok?'g':'r');
  if(!ok){const w=[...$('opts').children].find(b=>b.textContent===q.ans);if(w)w.classList.add('g')}
  $('ok').textContent=S.ok;
  $('combo').textContent=S.c;
  S.i++;
  setTimeout(()=>{if(S.i>=S.done)end();else next()},ok?600:1600);
}
function grade(p){return p>=90?['🏆','優']:p>=75?['😃','良']:p>=60?['🙂','中']:['💪','加油']}
function end(){
  clearInterval(S.id);
  const n=S.done,p=Math.round(S.ok/n*100),[e,g]=grade(p);
  // 紀錄存百分比：加考後分母變 20，存百分比先唔會同之前的 10 題紀錄打架
  const best=+(localStorage.p4mul||0);if(p>best)localStorage.p4mul=p;
  $('play').classList.add('hide');
  const o=$('over');o.classList.remove('hide');o.textContent='';
  o.appendChild(el('h2',null,`${e} 等第：${g}`));
  const mark=el('div',null,`${S.ok}/${n}`);mark.id='mark';o.appendChild(mark);
  const line=el('p',null,`答對 ${S.ok} 題，答錯 ${n-S.ok} 題　（${p}%）`);line.style.fontSize='24px';o.appendChild(line);
  const rec=el('p'),sm=el('small',null,`最高紀錄 ${Math.max(best,p)}%　｜　遊戲分數 ${S.s}`);
  rec.appendChild(sm);o.appendChild(rec);
  if(S.wrong.length){
    const w=el('div');w.id='wrong';
    w.appendChild(el('b',null,`要溫習嘅題目（${S.wrong.length} 題）`));
    for(const q of S.wrong){
      const row=el('div');
      row.appendChild(document.createTextNode(q.text));
      row.appendChild(el('br'));
      row.appendChild(el('b',null,`✅ 答案：${q.ans}`));
      w.appendChild(row);
    }
    o.appendChild(w);
  }else o.appendChild(el('p',null,'💯 全部答對，太厲害！'));
  o.appendChild(bigBtn('再考一次',()=>location.reload()));
  if(n<BANK)o.appendChild(bigBtn(`加考多 ${PER} 題 ▶`,more));
}
// 加考：答過嘅題唔會再出現，最多考齊題庫 ${BANK} 題
function more(){
  const used=new Set(S.q.slice(0,S.i).map(key));
  const rest=makeBank(BANK).filter(q=>!used.has(key(q))).slice(0,PER);
  S.q=S.q.concat(rest);S.done+=rest.length;S.extra++;
  $('over').classList.add('hide');
  $('play').classList.remove('hide');
  drawDots();next();
}
// ---- 由題目文字反推正確答案（自檢同 audit 工具共用；應用題唔能由文字反推，回 null） ----
function expect(q){
  let m=q.text.match(/^(\d+) × (\d+) × (\d+) = \?$/);            // 結合性質
  if(m)return [+m[1]*+m[2]*+m[3],`${m[1]} × ${m[2]} × ${m[3]}`];
  m=q.text.match(/^(\d+) × \? = (\d+)/);                        // 逆向思考：搵返因數
  if(m)return [+m[2]/+m[1],`${m[2]} ÷ ${m[1]}`];
  m=q.text.match(/^估算：(\d+) × (\d+) × (\d+) ≈/);            // 估算 + 結合性質（三個數）
  if(m){const ea=Math.round(+m[1]/10)*10,eb=Math.round(+m[2]/10)*10;return [ea*eb*+m[3],`${ea} × ${eb} × ${m[3]}`]}
  m=q.text.match(/^估算：(\d+) × (\d+) ≈/);                     // 估算：各取最接近嘅十位
  if(m){const ea=Math.round(+m[1]/10)*10,eb=Math.round(+m[2]/10)*10;return [ea*eb,`${ea} × ${eb}`]}
  m=q.text.match(/^(\d+) × (\d+) = (\d+)，寫出 (\d+) × (\d+) = \?$/); // 交換性質
  if(m){const p=+m[1]*+m[2];
    if(+m[4]!==+m[2]||+m[5]!==+m[1]||p!==+m[3])return[-1,'交換性質題目本身寫錯'];
    return [p,`${m[4]} × ${m[5]}`]}
  m=q.text.match(/^(\d+) × (\d+) = \?$/);                       // 其餘直式乘法
  if(m)return [+m[1]*+m[2],`${m[1]} × ${m[2]}`];
  return null;                                                  // 應用題：答案隨題目變
}
// ---- 自檢：?test 開啟時跑，斷言題目 / 選項 / 題庫 / 計分正確 ----
function selfTest(){
  const A=(c,m)=>{if(!c)throw new Error('FAIL: '+m)};
  for(const g of TYPES)for(let i=0;i<400;i++){const q=g(),o=opts(q);
    A(o.length===4&&o.includes(q.ans),'選項要有4個且含答案');
    A(new Set(o).size===4,'選項不可重複');
    A(/^\d+$/.test(q.ans),'答案格式: '+q.ans);
    A(+q.ans>0&&!/NaN/.test(q.text+q.ans+q.hint),'答案唔可以係 0／負數／NaN: '+q.text);
    const e=expect(q);
    if(e)A(+q.ans===e[0],`答案錯: ${q.text}（應該 ${e[1]} = ${e[0]}）`);
    A(q.hint&&q.hint.length>0,'提示唔可以係空');
    // 提示唔可以直接寫出答案，否則小朋友唔使計就睇到答案
    if(e)A(!new RegExp(`(^|\\D)${q.ans}(\\D|$)`).test(q.hint),'提示洩漏答案: '+q.text);}
  for(let t=0;t<300;t++){const bk=makeBank(BANK); // 題庫檢查
    A(bk.length===BANK,'題庫要 '+BANK+' 題');
    A(new Set(bk.map(key)).size===BANK,'題庫內有重複題');
    for(const q of bk){const o=opts(q);A(o.length===4&&o.includes(q.ans),'庫內選項錯');A(new Set(o).size===4,'庫內選項重複');}}
  // 抽題：每次一份 PER 題，加考亦唔會抽中答過嘅題（同一份 20 題內輪流抽到全 20）
  for(let t=0;t<200;t++){let q=makeBank(PER),seen=new Set(q.map(key));
    A(q.length===PER&&seen.size===PER,'首輪要 '+PER+' 題不重複');
    while(q.length<BANK){const rest=makeBank(BANK).filter(x=>!seen.has(key(x))).slice(0,PER);
      A(rest.length>0,'加考抽唔到新題');rest.forEach(x=>{seen.add(key(x));q=q.concat([x])})}
    A(seen.size===BANK,'加考後應集齊題庫 '+BANK+' 題');}
  // 計分：答對率 → 等第
  for(let k=0;k<=BANK;k++){const pc=Math.round(k/BANK*100);
    A(pc>=0&&pc<=100&&grade(pc)[1].length>0,'計分錯: '+k);}
  A(grade(100)[1]==='優'&&grade(89)[1]==='良'&&grade(74)[1]==='中'&&grade(59)[1]==='加油','等第界線錯');
  A(BANK===20&&PER===10&&SEC>0,'份數設定錯');
  // 4N1 範圍：兩位數×兩位數、三位數×兩位數
  for(const g of [qTwo,qBig])for(let i=0;i<300;i++){const q=g(),m=q.text.match(/^(\d+) × (\d+) =/);
    A(Math.max(+m[1],+m[2])<=999,'超出 4N1 數位範圍: '+q.text);}
  console.log('PASS 全部自檢通過');
  document.title='TEST OK';
  const h=el('h2',null,'✅ 自檢通過');h.style.color='#2ec4b6';h.style.textAlign='center';
  document.body.prepend(h);
}
if(location.search.includes('test'))selfTest();
</script>
</body>
</html>
